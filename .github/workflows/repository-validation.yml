name: Validate canonical skills repository

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate canonical repository
        run: python3 scripts/validate_repository.py
      - name: Run updater tests
        run: python3 -m unittest discover -s skill_updater/tests

  runtime-tools:
    name: Validate runtime tools
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.31"
      - name: Install and probe pinned runtime tools in disposable roots
        run: python3 skill_updater/update_skills.py validate-runtimes
      - name: Verify video backend consent and isolation
        run: python3 -m unittest discover -s skills/video-watch/evals
      - name: Verify proof-loop initialization boundaries
        run: python3 skills/repo-task-proof-loop/scripts/verify_package.py
