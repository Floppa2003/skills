name: Validate ChatGPT skill manifest

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install manifest dependency
        run: python3 -m pip install --disable-pip-version-check --require-hashes -r scripts/requirements-chatgpt.txt
      - name: Check generated manifest
        run: python3 scripts/build_chatgpt_md.py --check
